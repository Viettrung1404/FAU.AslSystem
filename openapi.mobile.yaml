    post:
      operationId: practice_availability
      summary: Availability of each separate mode
      description: Client-declared completed lesson/version pairs. Reject duplicate pairs, unknown or mismatched
        pairs and never-published versions with 422 VALIDATION_FAILED; withdrawn versions with 410 CONTENT_VERSION_RETIRED.
        Retained published older versions are valid. Multiple completed versions of one lesson are allowed
        but count as one distinct lesson. Use only the union of submitted version snapshots, including distractors;
        never substitute the current version. Guest completion cannot be independently verified. An empty
        list is valid for availability. All modes unlock at 3 distinct lessonIds. Unlocked modes may still
        have canGenerate=false when content is insufficient.
      tags:
      - practice
      security: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeAvailability'
              examples:
                default:
                  value:
                    minimumDistinctLessons: 3
                    completedDistinctLessons: 3
                    modes:
                    - mode: QUIZ
                      unlocked: true
                      canGenerate: true
                      reason: null
                      eligibleSignCount: 4
                      minimumSigns: 2
                      defaultItemCount: 10
