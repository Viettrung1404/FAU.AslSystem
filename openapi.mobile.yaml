        basePlanId null for App Store.
    Products:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoreProduct'
          minItems: 0
          maxItems: 100
        nextCursor:
          anyOf:
          - type: string
            example: opaque-cursor
          - type: 'null'
      required:
      - items
      - nextCursor
      additionalProperties: false
    Entitlements:
      type: object
      properties:
        premiumCollections:
          type: boolean
          example: true
        validUntil:
          anyOf:
          - type: string
            example: '2026-10-17T09:00:00Z'
            format: date-time
          - type: 'null'
        checkedAt:
          type: string
          example: '2026-10-17T08:00:00Z'
          format: date-time
      required:
      - premiumCollections
      - validUntil
      - checkedAt
      additionalProperties: false
      description: Derived from verified purchases only; null expiry with true means
        non-expiring entitlement.
    AppleProof:
      type: object
      properties:
        store:
          type: string
          enum:
          - APP_STORE
          example: APP_STORE
        productId:
          type: string
          example: asl.premium.yearly
        signedTransactionInfo:
          type: string
          example: mock-signed-transaction
          minLength: 1
          maxLength: 50000
      required:
      - store
      - productId
      - signedTransactionInfo
      additionalProperties: false
    GoogleProof:
      type: object
      properties:
        store:
          type: string
          enum:
          - GOOGLE_PLAY
          example: GOOGLE_PLAY
        productId:
          type: string
          example: asl.premium.yearly
        purchaseToken:
          type: string
          example: mock-purchase-token
          minLength: 1
          maxLength: 10000
      required:
      - store
      - productId
      - purchaseToken
      additionalProperties: false
    PurchaseProof:
      oneOf:
      - $ref: '#/components/schemas/AppleProof'
      - $ref: '#/components/schemas/GoogleProof'
      discriminator:
        propertyName: store
        mapping:
          APP_STORE: '#/components/schemas/AppleProof'
          GOOGLE_PLAY: '#/components/schemas/GoogleProof'
    PurchaseStatus:
      type: object
      properties:
        id:
          type: string
          example: 22ea23b6-1571-5427-a1ba-72b92b108f79
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - REJECTED
          example: PENDING
        reason:
          anyOf:
          - type: string
            example: STORE_PENDING
          - type: 'null'
        entitlements:
          $ref: '#/components/schemas/Entitlements'
      required:
      - id
      - status
      - reason
      - entitlements
      additionalProperties: false
    RestoreRequest:
      type: object
      properties:
        proofs:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseProof'
          minItems: 1
          maxItems: 100
      required:
      - proofs
      additionalProperties: false
    RestoreResult:
      type: object
      properties:
        purchases:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseStatus'
          minItems: 1
          maxItems: 100
        entitlements:
          $ref: '#/components/schemas/Entitlements'
      required:
      - purchases
      - entitlements
      additionalProperties: false
    Subscription:
      type: object
      properties:
        id:
          type: string
          example: c075d7e7-456a-57a6-af70-79222124087c
          format: uuid
        store: *id025
        productId:
          type: string
          example: asl.premium.yearly
        status:
          type: string
          enum:
          - ACTIVE
          - GRACE_PERIOD
          - EXPIRED
          - REVOKED
          - PENDING
          example: ACTIVE
        expiresAt:
          anyOf:
          - type: string
            example: '2026-10-17T09:00:00Z'
            format: date-time
          - type: 'null'
        autoRenew:
          type: boolean
          example: true
      required:
      - id
      - store
      - productId
      - status
      - expiresAt
      - autoRenew
      additionalProperties: false
    Subscriptions:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
          minItems: 0
          maxItems: 100
        nextCursor:
          anyOf:
          - type: string
            example: opaque-cursor
          - type: 'null'
      required:
      - items
      - nextCursor
      additionalProperties: false
    ManagementLink:
      type: object
      properties:
        url:
          type: string
          example: https://example.invalid/subscriptions
          format: uri
      required:
      - url
      additionalProperties: false
    MediaRefreshRequest:
      type: object
      properties:
        assetIds:
          type: array
          items:
            type: string
            example: 3a0cd01b-5ff3-51af-b6fc-a2f7bcc11313
            format: uuid
          minItems: 1
          maxItems: 100
          uniqueItems: true
      required:
      - assetIds
      additionalProperties: false
    MediaRefreshResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Media'
          minItems: 1
          maxItems: 100
      required:
      - items
      additionalProperties: false
    CompletedLessonVersion:
      type: object
      properties:
        lessonId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
      required:
      - lessonId
      - versionId
      additionalProperties: false
    ImageMedia:
      allOf:
      - $ref: '#/components/schemas/Media'
      - properties:
          mimeType:
            enum:
            - image/png
            - image/webp
    VideoMedia:
      allOf:
      - $ref: '#/components/schemas/Media'
      - properties:
          mimeType:
            const: video/mp4
    QuizTextOption:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        signId:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - id
      - signId
      - label
      additionalProperties: false
    QuizVideoOption:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        signId:
          type: string
          format: uuid
        video:
          $ref: '#/components/schemas/VideoMedia'
      required:
      - id
      - signId
      - video
      additionalProperties: false
    QuizImageOption:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        signId:
          type: string
          format: uuid
        image:
          $ref: '#/components/schemas/ImageMedia'
        label:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - id
      - signId
      - image
      - label
      additionalProperties: false
    QuizVideoToWordItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        signId:
          type: string
          format: uuid
        type:
          type: string
          const: VIDEO_TO_WORD
        payload:
          type: object
          properties:
            video:
              $ref: '#/components/schemas/VideoMedia'
            layout:
              type: string
              enum:
              - LIST
              - GRID_2X2
            options:
              type: array
              items:
                $ref: '#/components/schemas/QuizTextOption'
              minItems: 2
              maxItems: 4
          required:
          - video
          - layout
          - options
          additionalProperties: false
          allOf:
          - if:
              properties:
                layout:
                  const: GRID_2X2
            then:
              properties:
                options:
                  minItems: 4
                  maxItems: 4
        answerKey:
          $ref: '#/components/schemas/ChoiceAnswerKey'
      required:
      - id
      - signId
      - type
      - payload
      - answerKey
      additionalProperties: false
      description: signId identifies the target sign. All option signIds belong to sourceLessons snapshots.
        Option IDs, sign IDs and meanings must be distinct; correctOptionId resolves to the target sign. Only
        use image choices with an authored image-to-sign mapping in a submitted lesson version.
    QuizWordToVideoItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        signId:
          type: string
          format: uuid
        type:
          type: string
          const: WORD_TO_VIDEO
        payload:
          type: object
          properties:
            word:
              type: string
              minLength: 1
              maxLength: 2000
            layout:
              type: string
              enum:
              - LIST
              - GRID_2X2
            options:
              type: array
              items:
                $ref: '#/components/schemas/QuizVideoOption'
              minItems: 2
              maxItems: 4
          required:
          - word
          - layout
          - options
          additionalProperties: false
          allOf:
          - if:
              properties:
                layout:
                  const: GRID_2X2
            then:
              properties:
                options:
                  minItems: 4
                  maxItems: 4
        answerKey:
          $ref: '#/components/schemas/ChoiceAnswerKey'
      required:
      - id
      - signId
      - type
      - payload
      - answerKey
      additionalProperties: false
      description: signId identifies the target sign. All option signIds belong to sourceLessons snapshots.
        Option IDs, sign IDs and meanings must be distinct; correctOptionId resolves to the target sign. Only
        use image choices with an authored image-to-sign mapping in a submitted lesson version.
    QuizVideoToImageItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        signId:
          type: string
          format: uuid
        type:
          type: string
          const: VIDEO_TO_IMAGE
        payload:
          type: object
          properties:
            video:
              $ref: '#/components/schemas/VideoMedia'
            layout:
              type: string
              enum:
              - LIST
              - GRID_2X2
            options:
              type: array
              items:
                $ref: '#/components/schemas/QuizImageOption'
              minItems: 2
              maxItems: 4
          required:
          - video
          - layout
          - options
          additionalProperties: false
          allOf:
          - if:
              properties:
                layout:
                  const: GRID_2X2
            then:
              properties:
                options:
                  minItems: 4
                  maxItems: 4
        answerKey:
          $ref: '#/components/schemas/ChoiceAnswerKey'
      required:
      - id
      - signId
      - type
      - payload
      - answerKey
      additionalProperties: false
      description: signId identifies the target sign. All option signIds belong to sourceLessons snapshots.
        Option IDs, sign IDs and meanings must be distinct; correctOptionId resolves to the target sign. Only
        use image choices with an authored image-to-sign mapping in a submitted lesson version.
    PracticeReportContext:
      type: object
      properties:
        setId:
          type: string
          format: uuid
        mode:
          type: string
          const: QUIZ
        sourceLessons:
          type: array
          items:
            $ref: '#/components/schemas/CompletedLessonVersion'
          minItems: 0
          maxItems: 10000
          uniqueItems: true
        generatedAt:
          type: string
          format: date-time
        item:
          $ref: '#/components/schemas/QuizPracticeItem'
      required:
      - setId
      - mode
      - sourceLessons
      - generatedAt
      - item
      additionalProperties: false
      description: Exact client-held quiz snapshot for investigation, not proof of server issuance or completion.
        Keep original assetIds, option IDs and answerKey even after media URLs expire. Server checks targetId=item.id,
        source lesson/version relationships and option/answer references; retains snapshot with the report.
        Withdrawn source content must not prevent reporting a previously generated item. Never regenerate
        the question.
