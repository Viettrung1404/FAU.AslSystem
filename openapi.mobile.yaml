openapi: 3.1.0
info:
  title: ASL Mobile API
  version: 0.3.0
  description: Mobile only, updated 2026-10-18. Local learning, public signs, Premium collections.
    Development catalog examples unlock all lessons with empty prerequisiteLessonIds.
    Supersedes mobile v0.1; see MOBILE_CONTRACT.md and SYNC_PROTOCOL.md. Mock media placeholders,
    no deployment.
servers:
- url: http://127.0.0.1:4010
  description: Local mock; Android emulator uses 10.0.2.2
- url: https://api.example.invalid
  description: Replace with staging origin
paths:
  /api/v1/config:
    get:
      operationId: catalog_config
      summary: Mobile configuration
      description: Mobile configuration
      tags:
      - catalog
      security: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
              examples:
                default:
                  value:
                    apiVersion: v1
                    contractVersion: 0.3.0
                    dailyLessonLimit: null
                    practiceMinimumDistinctLessons: 3
                    practiceModes: &id021
                    - QUIZ
                    - FLASHCARDS
                    - SIGN_MATCHING
                    - ALPHABET_MATCHING
                    offlineLearningSupported: false
                    scoringPolicy:
                      version: 1
                      ordinaryQuestions: FIRST_ATTEMPT_ONLY
                      matching: EACH_CORRECT_PAIR_ONCE
                      reviewPoints: 0
                      commitOn: LESSON_COMPLETED
                      replayEarnsPoints: true
                    supportUrl: https://example.invalid/support
        '400':
          description: BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_request:
