  /api/v1/practice/sets:
    post:
      operationId: practice_generate
      summary: Full set for selected practice mode
      description: Client-declared completed lesson/version pairs. Reject duplicate pairs, unknown or mismatched
        pairs and never-published versions with 422 VALIDATION_FAILED; withdrawn versions with 410 CONTENT_VERSION_RETIRED.
        Retained published older versions are valid. Multiple completed versions of one lesson are allowed
        but count as one distinct lesson. Use only the union of submitted version snapshots, including distractors;
        never substitute the current version. Guest completion cannot be independently verified. An empty
        list is valid for availability. Stateless generation; Flutter keeps the set. Retry may produce another
        set. Return 1..itemCount items without repeated targets. expiresAt is only the media refresh horizon,
        not a report deadline. Quiz supports VIDEO_TO_WORD, WORD_TO_VIDEO and VIDEO_TO_IMAGE; GRID_2X2 requires
        four learned options. Use LIST with 2..4 options when four eligible choices are unavailable; omit
        image questions without authored image mappings. Matching itemCount counts rounds of 2..8 pairs.
        No Premium gate or lesson points/streak. Unlocked modes may still have canGenerate=false when content
        is insufficient.
