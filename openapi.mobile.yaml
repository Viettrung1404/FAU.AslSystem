  /api/v1/lessons/{lessonId}:
    get:
      operationId: lesson_content
      summary: Full lesson and local answer keys
      description: Public. Freeze version per attempt. Review ordinary wrong answers
        until correct, zero review points. Matching retries in place. Media loaded
        on demand. Unknown version 404, revoked version 410 requires explicit restart;
        never silently mix versions. No prerequisite or completion gate, including direct access
        to later lessons by a new guest. Publication and revocation rules still apply.
