  /api/v1/purchases/verify:
    post:
      operationId: billing_verify
      summary: Verify native Store purchase
      description: Login before purchase, native SDK binds billing-context. Verify
        app/product/account/transaction server-side. 202 may return PENDING or terminal
        status; poll ID. Only VERIFIED grants. Store transaction owner immutable;
        no client entitlement flags.
      tags:
      - billing
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          example: f7fdde8f-2da6-56c1-a96e-265e1d7a7666
          format: uuid
        description: Per account/operation, retain >=30 days; same key/body replays,
          different body 409. Store transactions deduped permanently.
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseStatus'
              examples:
                default:
                  value:
                    id: 22ea23b6-1571-5427-a1ba-72b92b108f79
                    status: PENDING
                    reason: null
                    entitlements:
                      premiumCollections: false
                      validUntil: null
                      checkedAt: '2026-10-17T08:00:00Z'
                verified:
                  value: &id019
                    id: 22ea23b6-1571-5427-a1ba-72b92b108f79
                    status: VERIFIED
                    reason: null
                    entitlements:
                      premiumCollections: true
                      validUntil: '2026-10-17T09:00:00Z'
                      checkedAt: '2026-10-17T08:00:00Z'
                rejected:
                  value: &id020
                    id: 22ea23b6-1571-5427-a1ba-72b92b108f79
                    status: REJECTED
                    reason: INVALID_PURCHASE_PROOF
                    entitlements:
                      premiumCollections: false
                      validUntil: null
                      checkedAt: '2026-10-17T08:00:00Z'
        '400':
          description: BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_request:
                  value:
                    error:
                      code: BAD_REQUEST
                      message: Bad request
                      requestId: 736a7efc-077f-5683-801a-4051821de245
        '422':
          description: VALIDATION_FAILED, INVALID_PURCHASE_PROOF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_failed:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: Validation failed
                      requestId: 736a7efc-077f-5683-801a-4051821de245
                invalid_purchase_proof:
                  value:
                    error:
                      code: INVALID_PURCHASE_PROOF
                      message: Invalid purchase proof
                      requestId: 736a7efc-077f-5683-801a-4051821de245
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limited:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Rate limited
                      requestId: 736a7efc-077f-5683-801a-4051821de245
        '503':
          description: SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                service_unavailable:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Service unavailable
                      requestId: 736a7efc-077f-5683-801a-4051821de245
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  value:
                    error:
                      code: UNAUTHORIZED
                      message: Unauthorized
                      requestId: 736a7efc-077f-5683-801a-4051821de245
        '409':
